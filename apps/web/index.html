<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SGEN Knowledge Base</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Apply the saved/system theme before paint to avoid a flash of the wrong colours. -->
    <script>
      (function () {
        try {
          var s = localStorage.getItem('kb:theme');
          if (s === 'dark' || (!s && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-body text-text font-sans">
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
